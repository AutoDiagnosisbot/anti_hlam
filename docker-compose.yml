services:
  postgres:
    image: postgres:16-alpine
    container_name: anti_hlam_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-anti_hlam}
      POSTGRES_USER: ${POSTGRES_USER:-anti_hlam}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-anti_hlam_dev_password}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - anti_hlam_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  app:
    build:
      context: .
    container_name: anti_hlam_app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 8083
      DATABASE_URL: postgres://${POSTGRES_USER:-anti_hlam}:${POSTGRES_PASSWORD:-anti_hlam_dev_password}@postgres:5432/${POSTGRES_DB:-anti_hlam}
    ports:
      - "${APP_HTTP_BIND:-8083}:8083"
    volumes:
      - anti_hlam_uploads:/app/server/uploads

  nginx:
    image: nginx:1.27-alpine
    container_name: anti_hlam_nginx
    restart: unless-stopped
    profiles:
      - https
    depends_on:
      - app
    environment:
      DOMAIN: ${DOMAIN:-localhost}
      PUBLIC_HTTPS_PORT: ${PUBLIC_HTTPS_PORT:-8443}
      DOLLAR: "$$"
    ports:
      - "${HTTP_BIND:-80}:80"
      - "${HTTPS_BIND:-8443}:443"
    volumes:
      - ./nginx/templates:/etc/nginx/templates:ro
      - ./nginx/certbot/www:/var/www/certbot:ro
      - ./nginx/certbot/conf:/etc/letsencrypt:ro

  certbot:
    image: certbot/certbot:v2.11.0
    container_name: anti_hlam_certbot
    profiles:
      - https
    volumes:
      - ./nginx/certbot/www:/var/www/certbot
      - ./nginx/certbot/conf:/etc/letsencrypt
      - ./nginx/certbot/logs:/var/log/letsencrypt

volumes:
  anti_hlam_pgdata:
  anti_hlam_uploads:
